<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>pathfind 흐름도</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1a1a1a;
    font-family: -apple-system, "Segoe UI", sans-serif;
    color: #eee;
  }

  #bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* 대제목: 박스/그림자 없이 글자만 떠 있게, 크게. boot에서 PATHFIND_TITLE 로 채운다. */
  #eyebrow {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    pointer-events: none;
    font-size: 26px;
    font-weight: 700;
    color: rgba(255,255,255,0.92);
    letter-spacing: -0.4px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: calc(100% - 40px);
  }

  /* 좌하단 조작 힌트 · 우하단 자료 종류 범례 */
  #hint, #legend {
    position: fixed;
    bottom: 14px;
    z-index: 7;
    pointer-events: none;
    font-size: 11.5px;
    color: rgba(255,255,255,0.55);
    letter-spacing: -0.1px;
  }
  #hint { left: 16px; }
  #legend { right: 16px; display: flex; gap: 14px; align-items: center; }
  #legend .lg-item { display: flex; align-items: center; gap: 6px; }
  #legend .lg-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  #viewport {
    position: absolute;
    inset: 0;
    transform: translate(0px, 0px) scale(1);
    transform-origin: 0 0;
    transition: none;
    z-index: 1;
    cursor: grab;
  }
  #viewport:active { cursor: grabbing; }

  #grid {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* 연결 선들은 카드 뒤에 */
  #links, #node-lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  #links line {
    stroke: rgba(255, 183, 77, 0.6);
    stroke-width: 2;
    stroke-dasharray: 6 4;
  }
  #links .arrow {
    fill: rgba(255, 183, 77, 0.6);
  }
  #node-lines line {
    stroke-width: 1;
    stroke-dasharray: 2 3;
  }

  .card {
    position: absolute;
    transform: translate(-50%, -50%);
    background: rgba(40, 60, 90, 0.88);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px;
    padding: 16px 18px 14px;
    color: #fff;
    min-width: 200px;
    max-width: 280px;
    user-select: none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    cursor: pointer;
    z-index: 1;
    transition: box-shadow 0.15s, background 0.15s, border-color 0.15s, transform 0.15s;
  }
  .card:hover {
    background: rgba(48, 72, 104, 0.94);
    border-color: rgba(255,183,77,0.55);
    box-shadow: 0 10px 26px rgba(0,0,0,0.55);
    transform: translate(-50%, -50%) scale(1.03);
  }

  /* 단계 번호: 카드 좌상단 모서리 칩 */
  .card .no {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #ffb74d;
    color: #1a1a1a;
    font-weight: 700;
    font-size: 11px;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    border-radius: 50%;
  }
  /* 아이콘: 카드 중앙 상단, 제목은 그 아래 가운데 정렬 */
  .card .icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    margin: 0 auto 8px;
    border-radius: 50%;
    background: rgba(255,183,77,0.14);
    border: 1px solid rgba(255,183,77,0.45);
    color: #ffb74d;
  }
  .card .icon svg { width: 24px; height: 24px; }
  .card .title {
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 8px;
    line-height: 1.25;
    letter-spacing: -0.1px;
    color: #fff;
    text-align: center;
  }
  .card .desc {
    font-size: 12.5px;
    color: rgba(255,255,255,0.78);
    line-height: 1.45;
    margin: 0;
  }

  .card .desc-list {
    margin: 4px 0 0;
  }
  .card .desc-bullet {
    font-size: 12.5px;
    color: rgba(255,255,255,0.78);
    line-height: 1.45;
    padding-left: 12px;
    position: relative;
    margin: 1px 0;
  }
  .card .desc-mark {
    position: absolute;
    left: 0;
    top: 0;
    color: #ffb74d;
    font-size: 12px;
  }

  /* 자료 점: 색은 자료 종류(kind)별로 인라인 style 로 넣는다 */
  .finding-node {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffb74d;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    cursor: pointer;
    z-index: 10;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    font-family: -apple-system, "Segoe UI", sans-serif;
  }
  .finding-node:hover {
    transform: translate(-50%, -50%) scale(1.25);
    box-shadow: 0 6px 14px rgba(0,0,0,0.55);
    filter: brightness(1.15);
    z-index: 20;
  }
  .finding-node .dot {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: inherit;
  }

  /* 라벨: 배경과 테두리 없이 글자만 떠 있음 */
  .finding-node .label {
    position: absolute;
    left: calc(100% + 6px);
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.95);
    padding: 2px 0;
    font-size: 11px;
    font-weight: 600;
    width: max-content;
    max-width: 12em;
    white-space: normal;
    line-height: 1.3;
    pointer-events: none;
    letter-spacing: -0.1px;
  }
  /* 위·아래 배치: 라벨이 여러 줄이어도 점을 덮지 않도록 점에서 먼 쪽 변을 기준으로 붙인다 */
  .finding-node.above .label {
    top: auto;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }
  .finding-node.below .label {
    top: calc(100% + 6px);
    bottom: auto;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }
  .finding-node.left .label {
    left: calc(-100% - 6px);
    right: auto;
    top: 50%;
    transform: translateY(-50%);
  }
  .finding-node.right .label {
    left: calc(100% + 6px);
    top: 50%;
    transform: translateY(-50%);
  }

  .tooltip {
    position: fixed;
    z-index: 8;
    background: rgba(20,28,44,0.97);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.45;
    pointer-events: none;
    box-shadow: 0 8px 22px rgba(0,0,0,0.55);
    max-width: 320px;
    transition: opacity 0.12s;
    opacity: 0;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .t-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .tooltip .t-name {
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    margin: 0;
  }
  .tooltip .t-note {
    color: rgba(255,255,255,0.82);
    margin: 4px 0 0;
    font-size: 12px;
  }
  .tooltip .t-evidence {
    color: rgba(255,255,255,0.7);
    font-size: 11.5px;
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  .tooltip .t-url {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    color: #ffb74d;
    text-decoration: none;
    word-break: break-all;
  }
  .tooltip .t-url:hover { text-decoration: underline; }

  /* 자료 종류 배지 (툴팁·모달 공용). 색은 인라인 style 로 넣는다 */
  .kind-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    border-radius: 4px;
    padding: 1px 6px;
    border: 1px solid;
    white-space: nowrap;
  }

  #modal-bg {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(8,10,16,0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s;
  }
  #modal-bg.open { opacity: 1; pointer-events: auto; }
  #modal {
    background: rgba(26,26,26,0.96);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 12px;
    padding: 22px 26px 22px;
    max-width: 480px;
    width: calc(100% - 40px);
    box-shadow: 0 18px 50px rgba(0,0,0,0.6);
    color: #fff;
    transform: translateY(6px);
    transition: transform 0.18s;
    position: relative;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
  }
  #modal-bg.open #modal { transform: translateY(0); }
  /* 단계 모달과 자료 모달은 같은 상자를 쓰되, 서로의 섹션은 숨긴다 */
  #modal-bg.finding .step-only { display: none; }
  #modal-bg:not(.finding) .finding-only { display: none; }
  #modal .m-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-right: 24px;
  }
  #modal .m-no {
    flex: 0 0 auto;
    background: #ffb74d;
    color: #1a1a1a;
    font-weight: 700;
    width: 26px;
    height: 26px;
    line-height: 26px;
    text-align: center;
    border-radius: 50%;
    font-size: 12px;
  }
  #modal .m-no svg { width: 15px; height: 15px; vertical-align: -3px; }
  #modal .m-title {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
  }
  #modal .m-kind { margin: -6px 0 12px; }
  #modal .m-section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: rgba(255,255,255,0.5);
    margin: 18px 0 6px;
  }
  #modal .m-desc {
    font-size: 13.5px;
    line-height: 1.55;
    color: rgba(255,255,255,0.9);
    white-space: pre-line;
    margin: 0;
  }
  #modal .m-evidence {
    font-size: 13px;
    line-height: 1.55;
    color: rgba(255,255,255,0.82);
    margin: 0;
    padding: 8px 12px;
    border-left: 3px solid rgba(255,183,77,0.5);
    background: rgba(255,255,255,0.04);
    border-radius: 0 6px 6px 0;
  }
  #modal .m-task {
    font-size: 13px;
    line-height: 1.5;
    color: rgba(255,255,255,0.92);
    margin: 0 0 8px;
    padding-left: 14px;
    position: relative;
  }
  #modal .m-task::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffb74d;
  }
  #modal .m-task .m-task-order {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: #ffb74d;
    background: rgba(255,183,77,0.15);
    border: 1px solid rgba(255,183,77,0.35);
    border-radius: 4px;
    padding: 0 5px;
    margin-right: 6px;
    letter-spacing: 0.3px;
  }
  #modal .m-task .m-task-why {
    display: block;
    color: rgba(255,255,255,0.62);
    font-size: 12px;
    margin-top: 2px;
    font-style: italic;
  }
  #modal .m-verdict-box {
    background: rgba(255,183,77,0.12);
    border: 1px solid rgba(255,183,77,0.4);
    border-radius: 6px;
    padding: 8px 12px;
    margin-top: 4px;
  }
  #modal .m-verdict-box .m-verdict-label {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: #ffb74d;
    border: 1px solid rgba(255,183,77,0.4);
    border-radius: 4px;
    padding: 0 5px;
    margin-right: 6px;
    vertical-align: middle;
  }
  #modal .m-verdict-box .m-verdict-reason {
    display: block;
    color: rgba(255,255,255,0.85);
    font-size: 12.5px;
    line-height: 1.5;
    margin-top: 4px;
  }
  #modal .m-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }
  #modal .m-link {
    display: inline-block;
    font-size: 12.5px;
    color: #ffb74d;
    text-decoration: none;
    border: 1px solid rgba(255,183,77,0.4);
    border-radius: 5px;
    padding: 4px 10px;
    background: rgba(255,183,77,0.08);
    word-break: break-all;
  }
  #modal .m-link:hover { background: rgba(255,183,77,0.18); text-decoration: underline; }
  #modal .m-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.6);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
  }
  #modal .m-close:hover { color: #fff; background: rgba(255,255,255,0.08); }
  #modal .m-empty {
    color: rgba(255,255,255,0.5);
    font-size: 12.5px;
    font-style: italic;
  }
</style>
</head>
<body>
  <div id="bg"></div>

  <div id="eyebrow"></div>
  <div id="hint">휠: 확대·축소 · 드래그: 이동 · 카드/점 클릭: 상세</div>
  <div id="legend"></div>

  <div id="viewport">
    <div id="grid">
      <svg id="links" xmlns="http://www.w3.org/2000/svg"></svg>
      <svg id="node-lines" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="cards"></div>
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <div id="modal-bg">
    <div id="modal">
      <button class="m-close" id="modal-close" aria-label="닫기">×</button>
      <div class="m-head"><span class="m-no" id="modal-no"></span><h3 class="m-title" id="modal-title"></h3></div>
      <div class="m-kind finding-only" id="modal-kind"></div>
      <p class="m-desc" id="modal-desc"></p>
      <div class="m-section-title step-only">이 단계에서 할 작업</div>
      <div id="modal-tasks" class="step-only"></div>
      <div class="m-section-title step-only">판정 · 근거</div>
      <div id="modal-verdict" class="step-only"></div>
      <div class="m-section-title finding-only">근거 (검색 결과 발췌)</div>
      <p class="m-evidence finding-only" id="modal-evidence"></p>
      <div class="m-section-title" id="modal-links-title">조사 결과 · 출처</div>
      <div class="m-links" id="modal-links"></div>
    </div>
  </div>

<script>
  (function () {

    // ============================================================
    //  ▼▼▼ 조사 결과 데이터 (render.py 가 이 배열과 PATHFIND_TITLE·ICONS 상수를 교체한다) ▼▼▼
    // ============================================================
    const PATHFIND_TITLE = "테스트 주제";
const PATHFIND_ICONS = {"circle-dot": "<circle cx=\"12\" cy=\"12\" r=\"1\"/> <circle cx=\"12\" cy=\"12\" r=\"10\"/>", "compass": "<circle cx=\"12\" cy=\"12\" r=\"10\"/> <path d=\"m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z\"/>"};
const steps = [{"no": 1, "title": "기획", "desc": "무엇을 만들지 정한다.", "icon": "compass", "verdict": "가져다 써도 됨", "verdictReason": "참고 사례 있음", "tasks": [{"order": 1, "task": "범위 정한다", "why": "방향을 잡는다"}], "findings": [{"kind": "참고 사례", "name": "예시 사례", "query": "예시 검색어", "evidence": "예시 근거 문장", "note": "메모", "url": "https://example.com"}]}];
    // ============================================================
    // ▲▲▲ 조사 결과 데이터 ▲▲▲
    // ============================================================

    // 아이콘 SVG 내부(path 등). render.py 가 assets/lucide-icons.json 에서 쓰인 것만 골라 넣는다.
    // 아이콘 출처: Lucide (https://lucide.dev) — ISC License, Copyright (c) Lucide Icons and Contributors
    const ICONS = (typeof PATHFIND_ICONS !== 'undefined' && PATHFIND_ICONS) ? PATHFIND_ICONS : {};
    const DEFAULT_ICON = 'circle-dot';

    // 자료 종류별 색 (점·연결선·배지·범례 공용)
    const KIND_COLORS = {
      '오픈소스':     '#4fc3f7',
      '무료 에셋':    '#81c784',
      '튜토리얼·블로그': '#ce93d8',
      '참고 사례':    '#ffb74d'
    };
    const KIND_ORDER = ['오픈소스', '무료 에셋', '튜토리얼·블로그', '참고 사례'];
    function kindColor(kind) { return KIND_COLORS[kind] || '#ffb74d'; }
    function hexToRgba(hex, a) {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    }
    function kindBadgeHtml(kind) {
      const c = kindColor(kind);
      return '<span class="kind-badge" style="color:' + c + ';border-color:' + hexToRgba(c, 0.5) + ';background:' + hexToRgba(c, 0.14) + '">' + escapeHtml(kind) + '</span>';
    }
    function iconSvg(name) {
      const inner = ICONS[name] || ICONS[DEFAULT_ICON] || '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/>';
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
    }

    const CARD_SPACING_X   = 380;
    const CARD_Y           = 330;
    const CARD_START_X     = 140;

    const viewport = document.getElementById('viewport');
    const linksSvg = document.getElementById('links');
    const nodeLinesSvg = document.getElementById('node-lines');
    const cardsEl  = document.getElementById('cards');
    const tooltip  = document.getElementById('tooltip');
    const eyebrow  = document.getElementById('eyebrow');
    const legendEl = document.getElementById('legend');

    const modalBg     = document.getElementById('modal-bg');
    const modalClose  = document.getElementById('modal-close');
    const modalNo     = document.getElementById('modal-no');
    const modalTitle  = document.getElementById('modal-title');
    const modalKind   = document.getElementById('modal-kind');
    const modalDesc   = document.getElementById('modal-desc');
    const modalTasks  = document.getElementById('modal-tasks');
    const modalVerdict = document.getElementById('modal-verdict');
    const modalEvidence = document.getElementById('modal-evidence');
    const modalLinksTitle = document.getElementById('modal-links-title');
    const modalLinks  = document.getElementById('modal-links');

    let tx = 0, ty = 0, scale = 1;
    const MIN_SCALE = 0.2, MAX_SCALE = 6;

    function apply() {
      viewport.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    }

    function log(...args) {
      console.log('[pathfind-flow] ' + args.join(' · '));
    }
    function logError(label, err) {
      console.error('[pathfind-flow] render 오류 — ' + label, err);
      if (err && err.stack) console.error(err.stack);
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const safeInnerWidth  = () => window.innerWidth  || document.documentElement.clientWidth  || 0;
    const safeInnerHeight = () => window.innerHeight || document.documentElement.clientHeight || 0;

    // ---------- 툴팁 ----------
    const showTooltip = function (clientX, clientY, kind, name, note, evidence, url) {
      tooltip.innerHTML =
        '<div class="t-head">' + kindBadgeHtml(kind) + '<strong class="t-name">' + escapeHtml(name) + '</strong></div>' +
        '<div class="t-note">' + escapeHtml(note) + '</div>' +
        (evidence ? '<div class="t-evidence">' + escapeHtml(evidence) + '</div>' : '') +
        (url  ? '<a class="t-url" href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(url) + ' ↗</a>' : '');
      tooltip.classList.add('show');

      const tw = tooltip.offsetWidth || 200;
      const th = tooltip.offsetHeight || 60;
      const margin = 12;
      let left = clientX + margin;
      let top  = clientY + margin;

      if (left + tw > safeInnerWidth() - margin) {
        left = clientX - tw - margin;
      }
      if (top + th > safeInnerHeight() - margin) {
        top = safeInnerHeight() - th - margin;
      }
      if (top < margin) top = margin;
      if (left < margin) left = margin;

      tooltip.style.left = left + 'px';
      tooltip.style.top  = top + 'px';
    };

    const hideTooltip = function () {
      tooltip.classList.remove('show');
    };

    // ---------- 결정론적 흔들림 ----------
    function hashStr(s) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    /**
     * findings 노드를 카드 위·아래 부채꼴에 번갈아 흩뿌린다 (좌우에는 놓지 않는다 — 이웃 카드와 겹치지 않도록).
     * halfH는 실제 카드 높이의 절반(render 시점에 offset으로 계산).
     */
    function scatterFindings(cardCenterX, cardCenterY, halfW, halfH, findings, seed) {
      const positions = [];
      const cx = cardCenterX, cy = cardCenterY;
      const count = findings.length;
      if (count === 0) return positions;

      const minR = halfH + 40;
      const maxR = minR + 90;
      const ringSpan = Math.PI * 0.55;

      for (let i = 0; i < count; i++) {
        const k = i >>> 1;
        const isUpper = (i & 1) === 0;
        const n = Math.ceil(count / 2);
        const t = n === 1 ? 0.5 : (k + 0.5) / n;
        const baseAngle = isUpper ? -Math.PI / 2 : Math.PI / 2;
        const shakeSeed = String(seed) + ':' + i;
        const shakeRaw = hashStr(shakeSeed);
        const shake = ((shakeRaw & 0xFF) / 255 - 0.5) * (ringSpan / n) * 0.4;
        const angle = baseAngle + (t - 0.5) * ringSpan + shake;

        const rSeed = String(seed) + ':r' + i;
        const rRaw = (hashStr(rSeed) >>> 4) & 0xFF;
        const rJ = rRaw / 255;
        const r = isUpper
          ? minR + (maxR - minR) * (0.25 + rJ * 0.3)
          : minR + (maxR - minR) * (0.6 + rJ * 0.4);

        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        positions.push({ x, y });
      }

      return positions;
    }

    /**
     * 라벨이 모든 카드 영역과 겹치지 않는 배치 방향(above/below/left/right)을 고른다.
     * 카드 뒤로 들어가는 일이 없도록, 노드·라벨은 카드보다 z-index가 높다.
     */
    function chooseLabelAnchorAll(posX, posY, cardRects, name) {
      const gap = 6;
      const labelH = 18;
      const nameLen = (name || '').length;
      const labelW = Math.min(220, Math.max(40, nameLen * 13 + 18));

      const overlap = (l, t, r, b, rects) => {
        for (let i = 0; i < rects.length; i++) {
          const cr = rects[i];
          if (!(r < cr.left || l > cr.right || b < cr.top || t > cr.bottom)) return true;
        }
        return false;
      };

      const candidates = [];
      candidates.push({
        cls: 'right',
        box: { left: posX + 9 + gap, top: posY - labelH / 2, right: posX + 9 + gap + labelW, bottom: posY + labelH / 2 }
      });
      candidates.push({
        cls: 'above',
        box: { left: posX - labelW / 2, top: posY - 9 - gap - labelH, right: posX + labelW / 2, bottom: posY - 9 - gap }
      });
      candidates.push({
        cls: 'below',
        box: { left: posX - labelW / 2, top: posY + 9 + gap, right: posX + labelW / 2, bottom: posY + 9 + gap + labelH }
      });
      candidates.push({
        cls: 'left',
        box: { left: posX - 9 - gap - labelW, top: posY - labelH / 2, right: posX - 9 - gap, bottom: posY + labelH / 2 }
      });

      // 위 → 아래 → 왼쪽 → 오른쪽 순으로 선호
      const order = ['above', 'below', 'left', 'right'];
      for (const pref of order) {
        const c = candidates.find(c => c.cls === pref);
        if (!overlap(c.box.left, c.box.top, c.box.right, c.box.bottom, cardRects)) {
          return c;
        }
      }
      // 전부 안 되면 오른쪽 (노드 z-index가 카드보다 높으므로 앞에는 나온다)
      return candidates[0];
    }

    // ---------- AABB 사후 검증 (관측용 로그 — 이동은 하지 않는다) ----------
    function buildBoxes() {
      const boxes = [];
      const stepEls = cardsEl.querySelectorAll('.card');
      const nodeEls = cardsEl.querySelectorAll('.finding-node');

      for (let i = 0; i < stepEls.length; i++) {
        const c = stepEls[i];
        const x = parseFloat(c.style.left);
        const y = parseFloat(c.style.top);
        const w = c.offsetWidth, h = c.offsetHeight;
        if (isNaN(x) || isNaN(y) || !w || !h) continue;
        boxes.push({ type: 'card', left: x - w / 2, top: y - h / 2, right: x + w / 2, bottom: y + h / 2 });
      }

      for (let i = 0; i < nodeEls.length; i++) {
        const n = nodeEls[i];
        const x = parseFloat(n.style.left);
        const y = parseFloat(n.style.top);
        const w = n.offsetWidth, h = n.offsetHeight;
        if (isNaN(x) || isNaN(y) || !w || !h) continue;
        const nodeLeft = x - w / 2;
        const nodeTop = y - h / 2;
        const labelEls = n.querySelectorAll('.label');
        for (const l of labelEls) {
          const lw = l.offsetWidth || 0, lh = l.offsetHeight || 0;
          const ox = l.offsetLeft || 0, oy = l.offsetTop || 0;
          boxes.push({ type: 'label', left: nodeLeft + ox, top: nodeTop + oy, right: nodeLeft + ox + lw, bottom: nodeTop + oy + lh });
        }
        boxes.push({ type: 'node', left: nodeLeft, top: nodeTop, right: x + w / 2, bottom: y + h / 2 });
      }
      return boxes;
    }

    function aabbOverlap(a, b, gap) {
      return !(a.right + gap <= b.left || a.left >= b.right + gap
               || a.bottom + gap <= b.top || a.top >= b.bottom + gap);
    }

    function postValidateLayout() {
      const boxes = buildBoxes();
      if (boxes.length === 0) {
        log('AABB 검사: 박스 0개 — 건너뜀');
        return;
      }
      let overlapCount = 0;
      const MIN_GAP = 12;
      for (let i = 0; i < boxes.length; i++) {
        for (let j = i + 1; j < boxes.length; j++) {
          if (aabbOverlap(boxes[i], boxes[j], MIN_GAP)) overlapCount++;
        }
      }
      log(`AABB 검사: 겹침 ${overlapCount}건 (이동 없음, 관측용)`);
    }

    // ---------- 범례 ----------
    function renderLegend() {
      if (!legendEl) return;
      const used = new Set();
      (steps || []).forEach(s => (s.findings || []).forEach(f => used.add(f.kind)));
      const kinds = KIND_ORDER.filter(k => used.has(k));
      legendEl.innerHTML = kinds.map(k =>
        '<span class="lg-item"><span class="lg-dot" style="background:' + kindColor(k) + '"></span>' + escapeHtml(k) + '</span>'
      ).join('');
    }

    // ---------- 데이터 → DOM 렌더링 ----------
    function render() {
      if (!cardsEl) throw new Error('cardsEl이 없습니다');
      if (!linksSvg) throw new Error('linksSvg이 없습니다');

      cardsEl.innerHTML = '';
      linksSvg.innerHTML = '';
      nodeLinesSvg.innerHTML = '';

      if (!steps || steps.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText =
          'position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); ' +
          'color:rgba(255,255,255,0.5); font-size:14px; pointer-events:none;';
        empty.textContent = '표시할 단계가 없습니다.';
        cardsEl.appendChild(empty);
        return;
      }

      const centers = [];
      for (let i = 0; i < steps.length; i++) {
        centers.push({ cx: CARD_START_X + i * CARD_SPACING_X, cy: CARD_Y });
      }

      // 단계 카드끼리 잇는 메인 선
      for (let i = 0; i < steps.length - 1; i++) {
        const a = centers[i];
        const b = centers[i + 1];
        const x1 = a.cx, y1 = a.cy, x2 = b.cx, y2 = b.cy;

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1 + 8);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2 + 8);
        linksSvg.appendChild(line);

        const arrowSize = 6;
        const angle = Math.atan2(y2 - y1, x2 - x1);
        const ax = x2 - arrowSize * Math.cos(angle);
        const ay = y2 - arrowSize * Math.sin(angle);
        const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        arrow.setAttribute('class', 'arrow');
        const pts = [
          [x2, y2 + 8],
          [ax - arrowSize * 0.4 * Math.sin(angle), ay + arrowSize * 0.4 * Math.cos(angle)],
          [ax + arrowSize * 0.4 * Math.sin(angle), ay - arrowSize * 0.4 * Math.cos(angle)]
        ].map(p => p.join(',')).join(' ');
        arrow.setAttribute('points', pts);
        linksSvg.appendChild(arrow);
      }

      // 카드 생성 (먼저 붙여 두어야 offset 측정이 유효)
      const cardEls = [];
      for (let i = 0; i < steps.length; i++) {
        const s = steps[i];
        const c = centers[i];

        const card = document.createElement('div');
        card.className = 'card';
        card.style.left = c.cx + 'px';
        card.style.top  = c.cy + 'px';
        card.setAttribute('data-step-no', String(s.no));
        // desc를 문장 단위(마침표 '다.' 기준)로 잘라 불릿 목록으로 표시. 문장이 하나면 불릿 없이 그대로.
        const raw = (s.desc || '').trim();
        const parts = raw.split(/(?<=다\.)\s+/).map(p => p.trim()).filter(Boolean);
        let descHtml;
        if (parts.length <= 1) {
          descHtml = '<div class="desc">' + escapeHtml(raw) + '</div>';
        } else {
          const items = parts.slice(0, 6).map(p =>
            '<div class="desc-bullet"><span class="desc-mark">·</span>' + escapeHtml(p) + '</div>');
          descHtml = '<div class="desc-list">' + items.join('') + '</div>';
        }
        card.innerHTML =
          '<div class="no">' + escapeHtml(String(s.no)) + '</div>' +
          '<div class="icon">' + iconSvg(s.icon) + '</div>' +
          '<div class="title">' + escapeHtml(s.title) + '</div>' +
          descHtml;
        cardsEl.appendChild(card);
        cardEls.push(card);
      }

      // 카드 실제 영역·반 측정
      const cardRects = [];
      const halfs = [];
      for (let i = 0; i < cardEls.length; i++) {
        const c = cardEls[i];
        const w = c.offsetWidth, h = c.offsetHeight;
        const centerX = centers[i].cx, centerY = centers[i].cy;
        cardRects.push({ left: centerX - w / 2, top: centerY - h / 2, right: centerX + w / 2, bottom: centerY + h / 2 });
        halfs.push({ halfW: w / 2, halfH: h / 2 });
      }

      // findings 노드 배치
      for (let i = 0; i < steps.length; i++) {
        const s = steps[i];
        const c = centers[i];
        const fhh = s.findings || [];
        const seed = hashStr(String(s.no) + ':' + i);
        const positions = scatterFindings(c.cx, c.cy, halfs[i].halfW, halfs[i].halfH, fhh, seed);

        for (let k = 0; k < fhh.length; k++) {
          const f = fhh[k];
          const pos = positions[k];
          if (!pos) continue;
          const color = kindColor(f.kind);

          // 노드 → 카드 연결선 (자료 종류 색)
          const nLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          nLine.setAttribute('x1', c.cx);
          nLine.setAttribute('y1', c.cy);
          nLine.setAttribute('x2', pos.x);
          nLine.setAttribute('y2', pos.y);
          nLine.setAttribute('stroke', hexToRgba(color, 0.35));
          nodeLinesSvg.appendChild(nLine);

          // 모든 카드와 안 겹치는 라벨 방향 선택
          const anchor = chooseLabelAnchorAll(pos.x, pos.y, cardRects, f.name);
          let cls = 'finding-node';
          if (anchor.cls === 'above') cls += ' above';
          else if (anchor.cls === 'below') cls += ' below';
          else if (anchor.cls === 'left') cls += ' left';
          else cls += ' right';

          const node = document.createElement('div');
          node.className = cls;
          node.style.left = pos.x + 'px';
          node.style.top  = pos.y + 'px';
          node.style.background = color;
          node.setAttribute('data-kind', f.kind);
          node.setAttribute('data-name', f.name);
          node.setAttribute('data-note', f.note);
          node.setAttribute('data-evidence', (f.evidence || ''));
          node.setAttribute('data-url', (f.url || ''));

          const dot = document.createElement('span');
          dot.className = 'dot';
          const label = document.createElement('span');
          label.className = 'label';
          label.setAttribute('title', f.name || '');
          label.textContent = f.name || '';

          node.appendChild(dot);
          node.appendChild(label);
          cardsEl.appendChild(node);
        }
      }
    }

    function renderWithPostValidate() {
      try {
        render();
        renderLegend();
        postValidateLayout();
        // 레이아웃·폰트가 자리 잡은 뒤 측정하기 위해 requestAnimationFrame 두 번 중첩으로 미룬다.
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            initialFit();
          });
        });
      } catch (e) {
        logError('render·사후검증·fit 실패', e);
      }
    }

    function initialFit() {
      if (!cardsEl) return false;

      const curScale = scale;
      const curTx = tx;
      const curTy = ty;

      // getBoundingClientRect로 카드·노드·라벨 전부 수집 → 캔버스 좌표로 역산
      let minX = Infinity, minY = Infinity;
      let maxRight = -Infinity, maxBottom = -Infinity;

      const els = cardsEl.querySelectorAll('.card, .finding-node, .finding-node .label');
      for (let i = 0; i < els.length; i++) {
        const r = els[i].getBoundingClientRect();
        if (r.width <= 0 || r.height <= 0) continue;
        const canvasX = (r.left - curTx) / curScale;
        const canvasY = (r.top - curTy) / curScale;
        const canvasR = (r.right - curTx) / curScale;
        const canvasB = (r.bottom - curTy) / curScale;
        if (canvasX < minX) minX = canvasX;
        if (canvasY < minY) minY = canvasY;
        if (canvasR > maxRight) maxRight = canvasR;
        if (canvasB > maxBottom) maxBottom = canvasB;
      }

      if (minX === Infinity) {
        log('아직 카드/findings 위치가 잡히지 않음 — 한 프레임 뒤 재시도');
        return false;
      }

      const contentW = maxRight - minX;
      const contentH = maxBottom - minY;
      if (contentW <= 0 || contentH <= 0) {
        log('콘텐츠 크기 0 — 한 프레임 뒤 재시도');
        return false;
      }

      const contentCX = minX + contentW / 2;
      const contentCY = minY + contentH / 2;

      const winW = safeInnerWidth();
      const winH = safeInnerHeight();
      if (winW <= 0 || winH <= 0) return false;

      // scale=min(화면폭/경계폭, 화면높이/경계높이)×0.9
      const scaleX = winW / contentW;
      const scaleY = winH / contentH;
      const nextScale = Math.min(scaleX, scaleY) * 0.9;

      scale = nextScale;
      tx = winW / 2 - contentCX * nextScale;
      ty = winH / 2 - contentCY * nextScale;

      const cardElsNow = cardsEl.querySelectorAll('.card');
      const centers = [];
      for (let i = 0; i < cardElsNow.length; i++) {
        const r = cardElsNow[i].getBoundingClientRect();
        centers.push({ i: i + 1, cx: Math.round((r.left + r.right) / 2), cy: Math.round((r.top + r.bottom) / 2) });
      }
      const centerList = centers.map(c => `카드${c.i}(cx=${c.cx},cy=${c.cy})`).join(' · ');
      log(`initialFit: 카드 ${centers.length}개 — ${centerList}`);
      log(`initialFit: 콘텐츠 경계 left=${Math.round(minX)} top=${Math.round(minY)} right=${Math.round(maxRight)} bottom=${Math.round(maxBottom)} → scale=${nextScale.toFixed(4)} tx=${Math.round(tx)} ty=${Math.round(ty)}`);
      apply();
      return true;
    }

    function boot() {
      // 대제목·브라우저 탭 제목 (render.py가 PATHFIND_TITLE 상수를 주입한 경우)
      try {
        if (typeof PATHFIND_TITLE !== 'undefined' && PATHFIND_TITLE) {
          if (eyebrow) eyebrow.textContent = PATHFIND_TITLE;
          document.title = PATHFIND_TITLE + ' — pathfind 흐름도';
        }
      } catch (e) {
        console.error('[pathfind-flow] 제목 세팅 오류', e);
      }
      try {
        renderWithPostValidate();
      } catch (e) {
        logError('boot renderAndFit', e);
      }
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }

    // ---------- 재조정 ----------
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        try { initialFit(); } catch (e) { logError('resize initialFit', e); }
      }, 80);
    });

    // ---------- 줌 ----------
    function zoomAt(clientX, clientY, factor) {
      const innerX = (clientX - tx) / scale;
      const innerY = (clientY - ty) / scale;

      const next = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
      tx = clientX - innerX * next;
      ty = clientY - innerY * next;
      scale = next;
      apply();
    }

    document.addEventListener('wheel', function (e) {
      e.preventDefault();
      const deltaY = e.deltaY;
      const factor = Math.exp(-deltaY * 0.0018);
      zoomAt(e.clientX, e.clientY, factor);
    }, { passive: false });

    // ---------- 드래그 ----------
    let dragging = false, dragStartX = 0, dragStartY = 0, dragTx0 = 0, dragTy0 = 0;
    document.addEventListener('mousedown', function (e) {
      if (e.target.closest('.card') || e.target.closest('.finding-node')) return;
      dragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragTx0 = tx;
      dragTy0 = ty;
      viewport.style.cursor = 'grabbing';
      e.preventDefault();
    });
    window.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      tx = dragTx0 + (e.clientX - dragStartX);
      ty = dragTy0 + (e.clientY - dragStartY);
      apply();
    });
    window.addEventListener('mouseup', function () {
      if (dragging) { dragging = false; viewport.style.cursor = ''; }
    });
    window.addEventListener('blur', function () { dragging = false; viewport.style.cursor = ''; });

    // ---------- 클릭 ----------
    if (cardsEl) {
      cardsEl.addEventListener('click', function (e) {
        const card = e.target.closest('.card');
        const node = e.target.closest('.finding-node');

        if (card) {
          const no = card.getAttribute('data-step-no');
          const step = (steps || []).find(s => String(s.no) === no) || { no: no, title: '', desc: '' };
          openStepModal(step);
          return;
        }

        if (node) {
          openFindingModal(node);
          return;
        }
      });
    }

    function openStepModal(step) {
      if (!modalBg) return;
      modalBg.classList.remove('finding');
      modalNo.textContent = step.no;
      modalTitle.textContent = step.title || '(제목 없음)';
      modalDesc.textContent = step.desc || '';

      // 작업 목록
      modalTasks.innerHTML = '';
      if (step.tasks && step.tasks.length) {
        const sorted = step.tasks.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
        for (const t of sorted) {
          const div = document.createElement('div');
          div.className = 'm-task';
          const order = (t.order != null) ? t.order : sorted.indexOf(t) + 1;
          div.innerHTML =
            '<span class="m-task-order">' + escapeHtml(String(order)) + '</span>' +
            '<strong>' + escapeHtml(t.task || '') + '</strong>' +
            (t.why ? '<span class="m-task-why">' + escapeHtml(t.why) + '</span>' : '');
          modalTasks.appendChild(div);
        }
      } else {
        const empty = document.createElement('div');
        empty.className = 'm-empty';
        empty.textContent = '이 단계에 적힌 작업이 없습니다.';
        modalTasks.appendChild(empty);
      }

      // 판정 · 근거
      modalVerdict.innerHTML = '';
      if (step.verdict) {
        const div = document.createElement('div');
        div.className = 'm-verdict-box';
        div.innerHTML =
          '<span class="m-verdict-label">' + escapeHtml(step.verdict) + '</span>' +
          (step.verdictReason ? '<span class="m-verdict-reason">' + escapeHtml(step.verdictReason) + '</span>' : '');
        modalVerdict.appendChild(div);
      } else {
        const empty = document.createElement('div');
        empty.className = 'm-empty';
        empty.textContent = '판정이 없습니다.';
        modalVerdict.appendChild(empty);
      }

      // 출처 링크 (자료별 이름 + 링크)
      modalLinksTitle.textContent = '조사 결과 · 출처';
      modalLinks.innerHTML = '';
      const seen = new Set();
      (step.findings || []).forEach(f => {
        if (!f || !f.url || seen.has(f.url)) return;
        seen.add(f.url);
        const a = document.createElement('a');
        a.className = 'm-link';
        a.href = f.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = (f.name ? f.name + ' · ' : '') + f.url;
        modalLinks.appendChild(a);
      });
      if (seen.size === 0) {
        const empty = document.createElement('div');
        empty.className = 'm-empty';
        empty.textContent = '이 단계에서는 선례를 찾지 못했습니다.';
        modalLinks.appendChild(empty);
      }

      modalBg.classList.add('open');
    }

    function openFindingModal(node) {
      if (!node || !modalBg) return;
      const kind     = node.getAttribute('data-kind') || '';
      const name     = node.getAttribute('data-name') || '';
      const note     = node.getAttribute('data-note') || '';
      const evidence = node.getAttribute('data-evidence') || '';
      const url      = node.getAttribute('data-url') || '';

      modalBg.classList.add('finding');
      modalNo.innerHTML = '';
      modalNo.textContent = '';
      modalNo.style.background = kindColor(kind);
      modalTitle.textContent = name || '(이름 없음)';
      modalKind.innerHTML = kindBadgeHtml(kind || '자료');
      modalDesc.textContent = note || '';

      modalEvidence.textContent = evidence || '(발췌 문장이 없습니다.)';

      modalLinksTitle.textContent = '출처';
      modalLinks.innerHTML = '';
      if (url) {
        const a = document.createElement('a');
        a.className = 'm-link';
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = url;
        modalLinks.appendChild(a);
      } else {
        const empty = document.createElement('div');
        empty.className = 'm-empty';
        empty.textContent = '출처 URL이 없습니다.';
        modalLinks.appendChild(empty);
      }

      modalBg.classList.add('open');
    }

    if (modalClose) modalClose.addEventListener('click', closeModal);
    if (modalBg) modalBg.addEventListener('click', function (e) {
      if (e.target === modalBg) closeModal();
    });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });
    function closeModal() {
      if (!modalBg) return;
      modalBg.classList.remove('open');
      modalNo.style.background = '';
    }

    // ---------- 툴팁 hover ----------
    if (cardsEl) {
      const onHover = function (e) {
        const node = e.target.closest('.finding-node');
        if (!node) { hideTooltip(); return; }
        showTooltip(
          e.clientX, e.clientY,
          node.getAttribute('data-kind'),
          node.getAttribute('data-name'),
          node.getAttribute('data-note'),
          node.getAttribute('data-evidence'),
          node.getAttribute('data-url')
        );
      };
      cardsEl.addEventListener('mouseover', onHover);
      cardsEl.addEventListener('mousemove', onHover);
      cardsEl.addEventListener('mouseout', function (e) {
        const node = e.target.closest('.finding-node');
        if (!node) return;
        if (!node.contains(e.relatedTarget)) hideTooltip();
      });
    }

    log('스크립트 종료 — boot/이벤트 등록 완료');
  })();
</script>
</body>
</html>
